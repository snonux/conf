apiVersion: apps/v1
kind: Deployment
metadata:
  name: keybr
  namespace: services
spec:
  replicas: 1
  # Recreate so the old pod fully terminates before the new one starts —
  # avoids NFS-lock races on the hostPath-backed PVC during rolling updates.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keybr
  template:
    metadata:
      labels:
        app: keybr
    spec:
      initContainers:
      - name: nfs-check-keybr-data
        image: busybox:stable
        command:
        - sh
        - -c
        - |
          test -f /mnt/.nfs-sentinel || (
            echo "ERROR: NFS sentinel missing at /mnt/.nfs-sentinel"
            echo "refusing to start; node likely has NFS unmounted"
            echo "pod would otherwise bind-mount the local-XFS shadow"
            exit 1
          )
        volumeMounts:
        - name: keybr-data
          mountPath: /mnt
          readOnly: true
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: keybr
        # Upstream publishes only :latest, so pin the digest (2023-11-18 build).
        image: ryanrhymes/keybr:latest@sha256:e3dc485a623cb04097ed5bf1ea3b7718a8b79459c6b8bcb159abbd70a4362298
        # Memory from the 14-day peak working set (504Mi), limit well above
        # it so normal spikes are never OOM-killed (audit 2026-09-25 #19).
        resources:
          requests:
            memory: 512Mi
          limits:
            memory: 1536Mi
        securityContext:
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 3000
        livenessProbe:
          exec:
            command: ["test", "-f", "/data/.nfs-sentinel"]
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 5
        env:
        - name: APP_URL
          value: "http://keybr.f3s.buetow.org/"
        - name: COOKIE_DOMAIN
          value: "keybr.f3s.buetow.org"
        - name: COOKIE_SECURE
          value: "false"
        - name: DATA_DIR
          value: "/data"
        - name: DATABASE_CLIENT
          value: "sqlite"
        - name: DATABASE_FILENAME
          value: "/data/database.sqlite"
        volumeMounts:
        - name: keybr-data
          mountPath: /data
      volumes:
      - name: keybr-data
        persistentVolumeClaim:
          claimName: keybr-data-pvc
