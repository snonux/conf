# PostgreSQL 18 with VectorChord 1.1.1 and pgvector 0.8.5.
# The PG16 database was dumped and restored into 18/f3s on 2026-10-17;
# its original files remain at the PVC root. The restore rebuilt vector
# indexes, so the legacy pgvecto.rs preload and compatibility image are gone.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-postgres
  namespace: services
spec:
  replicas: 1
  # Recreate (not RollingUpdate) so the old pod is fully terminated before
  # the new one starts. The hostPath PV points at an NFS-backed directory
  # mounted on every r-node, so RWO is not actually enforced across nodes:
  # under RollingUpdate the new pod can start on a different node and grab
  # the same data dir while the old pod still holds postgres' file locks,
  # producing "could not write to file postmaster.pid: Unknown error 512".
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: immich-postgres
  template:
    metadata:
      labels:
        app: immich-postgres
    spec:
      initContainers:
      - name: nfs-check-data
        image: busybox:1.36.1
        command:
        - sh
        - -c
        - |
          test -f /mnt/.nfs-sentinel || (
            echo "ERROR: NFS sentinel missing at /mnt/.nfs-sentinel"
            echo "refusing to start; node likely has NFS unmounted"
            echo "pod would otherwise bind-mount the local-XFS shadow"
            exit 1
          )
        volumeMounts:
        - name: postgres-data
          mountPath: /mnt
          readOnly: true
      containers:
      - name: postgres
        image: registry.lan.buetow.org:30001/immich-postgres:18.6-vchord1.1.1
        ports:
        - containerPort: 5432
        env:
        # The original PG16 directory remains at the PVC root for rollback.
        # PostgreSQL supports our hard-mounted NFSv4 storage; the server uses
        # synchronous writes (vfs.nfsd.async=0, ZFS sync=standard). The image
        # rejects all NFS by default; retain the established storage layout.
        # https://www.postgresql.org/docs/18/creating-cluster.html#CREATING-CLUSTER-NFS
        - name: IGNORE_DATABASE_FSTYPE
          value: "true"
        - name: PGDATA
          value: /var/lib/postgresql/18/f3s
        - name: POSTGRES_DB
          value: immich
        - name: POSTGRES_USER
          value: immich
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: immich-db-secret
              key: password
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            # pg_isready only checks the TCP port; the NFS check catches stale
            # file handles on the data directory after an NFS server restart.
            - pg_isready -U immich -d immich && test -f "$PGDATA/global/pg_filenode.map"
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 6
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - pg_isready -U immich -d immich
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 6
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: immich-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: immich-postgres
  namespace: services
spec:
  selector:
    app: immich-postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
