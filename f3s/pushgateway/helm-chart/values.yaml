replicaCount: 1

image:
  repository: prom/pushgateway
  # Pinned by the multi-arch index digest (Docker Hub, task i54): the tag
  # alone with pullPolicy Always would follow a re-pushed tag on any restart.
  # Bump tag and digest together (skopeo inspect --raw | sha256sum).
  tag: "v1.11.5@sha256:bf6442633f6129d3e3f9861fa14c77bc012d74b33a1dd213d7b458b89ce3cc5d"
  pullPolicy: Always

service:
  type: ClusterIP
  port: 9091

# Local NodePort pushgateway-lan: the Shelly probe on pi0/pi1 (task s44).
lanService:
  nodePort: 30091

resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "128Mi"
    cpu: "200m"

namespace: monitoring
