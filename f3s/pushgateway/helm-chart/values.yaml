replicaCount: 1

image:
  repository: prom/pushgateway
  tag: v1.11.4
  pullPolicy: Always

service:
  type: ClusterIP
  port: 9091

# Local NodePort pushgateway-lan: the Shelly probe on pi0/pi1 (task s44).
lanService:
  nodePort: 30091

resources:
  requests:
    memory: "64Mi"
    cpu: "100m"
  limits:
    memory: "128Mi"
    cpu: "200m"

namespace: monitoring
