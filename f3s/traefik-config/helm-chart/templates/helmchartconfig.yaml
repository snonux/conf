apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # Patch the bundled K3s Traefik without changing the chart or routing values.
    image:
      repository: docker.io/library/traefik
      tag: "3.7.15"

    # Local NodePort routing preserves the frontend source and admits only
    # ready local endpoints. relayd TCP checks select the matching nodes.
    # Public relayd uses this existing NodePort directly. ServiceLB hostPort
    # forwarding on nodes without endpoints can SNAT through a pod despite
    # Local policy; direct NodePort keeps frontend peer identity and fails
    # health checks on those nodes. Keep relayd.conf.tmpl in sync.
    ports:
      web:
        nodePort: 31637

    service:
      spec:
        externalTrafficPolicy: Local

    additionalArguments:
      # Only the TLS-terminating OpenBSD frontends generate trusted headers.
      # LAN f0/f1 relay TCP unchanged: trust no HTTP headers on websecure.
      # Drop separator aliases before trusted-header handling; CGI-style
      # backends can normalize X_Real_IP/X.Real.Ip to the canonical name.
      - "--entryPoints.web.http.aliasHeadersStrategy=delete"
      - "--entryPoints.websecure.http.aliasHeadersStrategy=delete"
      - "--entryPoints.web.forwardedHeaders.trustedIPs=192.168.2.110/32,192.168.2.111/32"
      - "--entryPoints.web.http.middlewares=kube-system-forwarded-sanitize@kubernetescrd"
      - "--entryPoints.websecure.http.middlewares=kube-system-forwarded-sanitize@kubernetescrd,kube-system-https-headers@kubernetescrd"
      # No relay emits PROXY protocol. Leave its parser disabled on both
      # entrypoints; enabling trustedIPs would create an unused trust path.

    # Expose Traefik's own Prometheus metrics and let kube-prometheus-stack
    # scrape them. Without this there are no traefik_* series at all, so
    # "which site is generating the ingress traffic?" can only be guessed at
    # from backend pod counters -- cAdvisor sees bytes per pod, not per host
    # or per route.
    #
    # addRoutersLabels/addServicesLabels are the point of the exercise: they
    # add `router` and `service` labels to traefik_*_bytes_total, which is
    # what makes a per-site breakdown possible. They do raise metric
    # cardinality (roughly one series set per ingress route); that is fine at
    # this cluster's ~30 routes but is the knob to turn off if the Prometheus
    # TSDB starts to bloat.
    #
    # The serviceMonitor needs `release: prometheus` -- kube-prometheus-stack
    # only picks up ServiceMonitors carrying its own release label.
    metrics:
      prometheus:
        addEntryPointsLabels: true
        addRoutersLabels: true
        addServicesLabels: true
        serviceMonitor:
          enabled: true
          additionalLabels:
            release: prometheus
