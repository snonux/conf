apiVersion: apps/v1
kind: Deployment
metadata:
  name: player
  namespace: services
spec:
  replicas: 1
  # Recreate so the old pod fully terminates before the new one starts —
  # avoids NFS-lock races on the hostPath-backed PVC during rolling updates.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: player
  template:
    metadata:
      labels:
        app: player
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      initContainers:
        - name: nfs-check-data
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              test -f /mnt/.nfs-sentinel || (
                echo "ERROR: NFS sentinel missing at /mnt/.nfs-sentinel"
                echo "refusing to start; node likely has NFS unmounted"
                echo "pod would otherwise bind-mount the local-XFS shadow"
                exit 1
              )
          volumeMounts:
            - name: player-data
              mountPath: /mnt
              readOnly: true
        - name: nfs-check-media
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              test -f /mnt/.nfs-sentinel || (
                echo "ERROR: NFS sentinel missing at /mnt/.nfs-sentinel"
                echo "refusing to start; node likely has NFS unmounted"
                echo "pod would otherwise bind-mount the local-XFS shadow"
                exit 1
              )
          volumeMounts:
            - name: player-media
              mountPath: /mnt
              readOnly: true
        - name: nfs-check-thumbnails
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              test -f /mnt/.nfs-sentinel || (
                echo "ERROR: NFS sentinel missing at /mnt/.nfs-sentinel"
                echo "refusing to start; node likely has NFS unmounted"
                echo "pod would otherwise bind-mount the local-XFS shadow"
                exit 1
              )
          volumeMounts:
            - name: player-thumbnails
              mountPath: /mnt
              readOnly: true
        # The library volumes below belong to other services. Their sentinel
        # sits at the PV root, which is checked here; the container mounts a
        # subdirectory of it. That subdirectory is checked as well: kubelet
        # creates a missing subPath (as an empty directory in the other
        # service's library), and a rescan of the empty set would then
        # remove all its items from Player.
        - name: nfs-check-music
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              test -f /mnt/.nfs-sentinel || (
                echo "ERROR: NFS sentinel missing at /mnt/.nfs-sentinel"
                echo "refusing to start; node likely has NFS unmounted"
                echo "pod would otherwise bind-mount the local-XFS shadow"
                exit 1
              )
          volumeMounts:
            - name: player-music
              mountPath: /mnt
              readOnly: true
        - name: nfs-check-audiobooks
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              # Each check only ends its own subshell; set -e makes the
              # first failing one end the script.
              set -e
              test -f /mnt/.nfs-sentinel || (
                echo "ERROR: NFS sentinel missing at /mnt/.nfs-sentinel"
                echo "refusing to start; node likely has NFS unmounted"
                echo "pod would otherwise bind-mount the local-XFS shadow"
                exit 1
              )
              test -d "/mnt/default" || (
                echo "ERROR: library directory /mnt/default is missing"
                echo "refusing to start; kubelet would create the subPath"
                echo "inside the other service's library and serve an empty set"
                exit 1
              )
          volumeMounts:
            - name: player-audiobooks
              mountPath: /mnt
              readOnly: true
        - name: nfs-check-libraries
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              # Each check only ends its own subshell; set -e makes the
              # first failing one end the script.
              set -e
              test -f /mnt/.nfs-sentinel || (
                echo "ERROR: NFS sentinel missing at /mnt/.nfs-sentinel"
                echo "refusing to start; node likely has NFS unmounted"
                echo "pod would otherwise bind-mount the local-XFS shadow"
                exit 1
              )
              test -d "/mnt/musicvideos" || (
                echo "ERROR: library directory /mnt/musicvideos is missing"
                echo "refusing to start; kubelet would create the subPath"
                echo "inside the other service's library and serve an empty set"
                exit 1
              )
              test -d "/mnt/yoga" || (
                echo "ERROR: library directory /mnt/yoga is missing"
                echo "refusing to start; kubelet would create the subPath"
                echo "inside the other service's library and serve an empty set"
                exit 1
              )
          volumeMounts:
            - name: player-libraries
              mountPath: /mnt
              readOnly: true
        - name: nfs-check-syncthing
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              # Each check only ends its own subshell; set -e makes the
              # first failing one end the script.
              set -e
              test -f /mnt/.nfs-sentinel || (
                echo "ERROR: NFS sentinel missing at /mnt/.nfs-sentinel"
                echo "refusing to start; node likely has NFS unmounted"
                echo "pod would otherwise bind-mount the local-XFS shadow"
                exit 1
              )
              test -d "/mnt/paul/Pixel7Pro/DCIM/Irregular Ninja" || (
                echo "ERROR: library directory /mnt/paul/Pixel7Pro/DCIM/Irregular Ninja is missing"
                echo "refusing to start; kubelet would create the subPath"
                echo "inside the other service's library and serve an empty set"
                exit 1
              )
          volumeMounts:
            - name: player-syncthing
              mountPath: /mnt
              readOnly: true
      containers:
        - name: player
          image: registry.lan.buetow.org:30001/player:d1bd1e5
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: DB_PATH
              value: "/data/media.db"
            - name: MEDIA_ROOT
              value: "/media"
            - name: SECURE_COOKIES
              value: "true"
            # All generated thumbnails go to their own volume instead of a
            # .thumbnails directory next to each media file, so the
            # read-only library sets below get thumbnails too.
            - name: THUMBNAIL_CACHE_DIR
              value: "/thumbnails"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            # The 1s default times out while a rescan keeps the single CPU
            # busy with ffprobe/ffmpeg.
            timeoutSeconds: 5
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 5
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              # One ffmpeg transcode (legacy formats, TRANSCODE_MAX_JOBS=1)
              # needs about 400 MB next to the server itself.
              memory: 1Gi
              cpu: "1"
          volumeMounts:
            - name: player-data
              mountPath: /data
            - name: player-thumbnails
              mountPath: /thumbnails
            - name: player-media
              mountPath: /media
            # Libraries of other services as media sets: the directory name
            # under /media is the set name. Read-only, so Player can neither
            # write into them nor delete a file when an item is removed in
            # the UI; their thumbnails live in /thumbnails. The mount point
            # directories exist in the media volume on NFS.
            - name: player-music
              mountPath: /media/Music
              readOnly: true
            - name: player-audiobooks
              mountPath: /media/Audiobooks
              subPath: default
              readOnly: true
            - name: player-libraries
              mountPath: "/media/Music Videos"
              subPath: musicvideos
              readOnly: true
            - name: player-libraries
              mountPath: /media/Yoga
              subPath: yoga
              readOnly: true
            - name: player-syncthing
              mountPath: "/media/Irregular Ninja"
              subPath: "paul/Pixel7Pro/DCIM/Irregular Ninja"
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: player-data
          persistentVolumeClaim:
            claimName: player-data-pvc
        - name: player-media
          persistentVolumeClaim:
            claimName: player-media-pvc
        - name: player-thumbnails
          persistentVolumeClaim:
            claimName: player-thumbnails-pvc
        - name: player-music
          persistentVolumeClaim:
            claimName: player-music-pvc
            readOnly: true
        - name: player-audiobooks
          persistentVolumeClaim:
            claimName: player-audiobooks-pvc
            readOnly: true
        - name: player-libraries
          persistentVolumeClaim:
            claimName: player-libraries-pvc
            readOnly: true
        - name: player-syncthing
          persistentVolumeClaim:
            claimName: player-syncthing-pvc
            readOnly: true
        - name: tmp
          emptyDir: {}
