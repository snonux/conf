apiVersion: v1
kind: PersistentVolume
metadata:
  name: player-data-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/nfs/k3svolumes/player/data
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: player-data-pvc
  namespace: services
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: player-media-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/nfs/k3svolumes/player/media
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: player-media-pvc
  namespace: services
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# Shared libraries of other services, mounted read-only as media sets.
#
# Each PV points at the directory another chart already uses as a PV root
# (Navidrome, Audiobookshelf, Jellyfin, Syncthing), because that is where the
# .nfs-sentinel file lives (see docs/nfs-sentinel-initcontainer.md). The
# deployment mounts the wanted subdirectory with subPath, so nothing is
# copied, moved or created inside those libraries.
#
# Navidrome music library (set "Music")
apiVersion: v1
kind: PersistentVolume
metadata:
  name: player-music-pv
spec:
  capacity:
    storage: 500Gi
  volumeMode: Filesystem
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  # Pre-bound both ways (claimRef here, volumeName on the claim): these PVs
  # share a hostPath with another chart's PV, so neither side may be left to
  # the binder's capacity matching.
  claimRef:
    namespace: services
    name: player-music-pvc
  hostPath:
    path: /data/nfs/k3svolumes/navidrome/music
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: player-music-pvc
  namespace: services
spec:
  storageClassName: ""
  volumeName: player-music-pv
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 500Gi
---
