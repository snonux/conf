apiVersion: v1
kind: PersistentVolume
metadata:
  name: player-data-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/nfs/k3svolumes/player/data
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: player-data-pvc
  namespace: services
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: player-media-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/nfs/k3svolumes/player/media
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: player-media-pvc
  namespace: services
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# Generated thumbnails (THUMBNAIL_CACHE_DIR). They get a volume of their own
# because the library sets below are read-only: Player cannot keep
# thumbnails next to those media files, and must not write into them.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: player-thumbnails-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: services
    name: player-thumbnails-pvc
  hostPath:
    path: /data/nfs/k3svolumes/player/thumbnails
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: player-thumbnails-pvc
  namespace: services
spec:
  storageClassName: ""
  volumeName: player-thumbnails-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# Library sources, mounted read-only as media sets.
#
# External sources use the existing Navidrome and Syncthing
# roots; Player-owned content uses player/libraries. Each root has its own
# .nfs-sentinel (see docs/nfs-sentinel-initcontainer.md). Init containers
# check required subdirectories before kubelet can create an empty subPath.
#
# hostPath and the claim binding are immutable: to point a set elsewhere,
# introduce a new PV/PVC pair, switch the pod, then retire the old pair.
#
# Navidrome music library (set "Music")
apiVersion: v1
kind: PersistentVolume
metadata:
  name: player-music-pv
spec:
  capacity:
    storage: 500Gi
  volumeMode: Filesystem
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  # Pre-bound both ways (claimRef here, volumeName on the claim): these PVs
  # share a hostPath with another chart's PV, so neither side may be left to
  # the binder's capacity matching.
  claimRef:
    namespace: services
    name: player-music-pvc
  hostPath:
    path: /data/nfs/k3svolumes/navidrome/music
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: player-music-pvc
  namespace: services
spec:
  storageClassName: ""
  volumeName: player-music-pv
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 500Gi
---
# Player-owned audiobooks, podcasts, musicvideos and yoga: read-only sets.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: player-content-pv
spec:
  capacity:
    storage: 500Gi
  volumeMode: Filesystem
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  # Bind explicitly so the claim cannot select a different same-sized PV.
  claimRef:
    namespace: services
    name: player-content-pvc
  hostPath:
    path: /data/nfs/k3svolumes/player/libraries
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: player-content-pvc
  namespace: services
spec:
  storageClassName: ""
  volumeName: player-content-pv
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 500Gi
---
# Syncthing data; the phone's DCIM/Irregular Ninja folder is the set "Irregular Ninja"
apiVersion: v1
kind: PersistentVolume
metadata:
  name: player-syncthing-pv
spec:
  capacity:
    storage: 500Gi
  volumeMode: Filesystem
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  # Pre-bound both ways (claimRef here, volumeName on the claim): these PVs
  # share a hostPath with another chart's PV, so neither side may be left to
  # the binder's capacity matching.
  claimRef:
    namespace: services
    name: player-syncthing-pvc
  hostPath:
    path: /data/nfs/k3svolumes/syncthing/data
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: player-syncthing-pvc
  namespace: services
spec:
  storageClassName: ""
  volumeName: player-syncthing-pv
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 500Gi
