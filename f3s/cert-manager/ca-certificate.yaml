---
# CA certificate for signing other certificates
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: selfsigned-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: f3s-lan-ca
  secretName: selfsigned-ca-secret
  privateKey:
    algorithm: RSA
    size: 4096
    # Keep the CA key across renewals. cert-manager >= 1.18 defaults to
    # Always, which would give the renewed root a new key and break every
    # client that trusts the exported f3s-lan-ca. The leaf wildcard certs
    # keep the default (Always): a fresh leaf key per renewal is harmless.
    rotationPolicy: Never
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
  duration: 87600h # 10 years
  renewBefore: 720h # 30 days
