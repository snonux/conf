apiVersion: apps/v1
kind: Deployment
metadata:
  name: webdav
  namespace: services
spec:
  replicas: 1
  # Pod swaps must not reach a pod that cannot answer (task r74). With one
  # replica the default RollingUpdate (25% surge rounds up to 1, 25%
  # unavailable rounds down to 0) already starts the new pod before the
  # old one goes; minReadySeconds keeps the old pod until the new one has
  # been Ready for 10 s, long enough for Traefik to add the new endpoint
  # before it drops the old one, so it never has zero backends.
  minReadySeconds: 10
  selector:
    matchLabels:
      app: webdav
  template:
    metadata:
      labels:
        app: webdav
    spec:
      securityContext:
        fsGroup: 65534
        seLinuxOptions:
          type: spc_t
          # Kubelet 1.37 checks labels across init and app containers sharing
          # this volume. Keep their existing spc_t type at one explicit level
          # instead of assigning a different random MCS level to each.
          level: s0
      initContainers:
      - name: nfs-check-data
        image: busybox:1.36.1
        command:
        - sh
        - -c
        - |
          test -f /mnt/.nfs-sentinel || (
            echo "ERROR: NFS sentinel missing at /mnt/.nfs-sentinel"
            echo "refusing to start; node likely has NFS unmounted"
            echo "pod would otherwise bind-mount the local-XFS shadow"
            exit 1
          )
        volumeMounts:
        - name: webdav-data
          mountPath: /mnt
          readOnly: true
      - name: setup
        # Official Debian (trixie) httpd image, pinned to its multi-arch index
        # digest. setup copies this image's conf/ tree into the shared
        # apache-conf emptyDir that the webdav container then runs with, so
        # both containers must always use the same image: bump them together.
        # httpd.conf keeps the image's User/Group www-data lines: they only
        # apply when httpd starts as root, and the webdav container runs as
        # UID/GID 65534 from its securityContext, so they are ignored.
        image: docker.io/library/httpd:2.4.71@sha256:07e4ec0094d8bca9765fae74ce33d2be5341884048f265ff9dc1d1177a4256c9
        command:
        - /bin/bash
        - -c
        - |
          cp -r /usr/local/apache2/conf/* /apache-conf/
          cp -r /usr/local/apache2/logs /apache-logs-init/
          echo "Include conf/extra/httpd-dav.conf" >> /apache-conf/httpd.conf
          sed -i 's/Listen 80/Listen 8080/' /apache-conf/httpd.conf
          mkdir -p /lock-dir/apache2
          chown -R 65534:65534 /apache-conf /apache-logs-init /lock-dir
        volumeMounts:
        - name: apache-conf
          mountPath: /apache-conf
        - name: apache-logs
          mountPath: /apache-logs-init
        - name: webdav-lock
          mountPath: /lock-dir
      containers:
      - name: webdav
        image: docker.io/library/httpd:2.4.71@sha256:07e4ec0094d8bca9765fae74ce33d2be5341884048f265ff9dc1d1177a4256c9
        # Memory from the 14-day peak working set (15Mi), limit well above
        # it so normal spikes are never OOM-killed (audit 2026-09-25 #19).
        resources:
          requests:
            memory: 32Mi
          limits:
            memory: 256Mi
        securityContext:
          runAsUser: 65534
          runAsGroup: 65534
        ports:
        - containerPort: 8080
        # Readiness gates the Service endpoint on httpd accepting connections
        # (task r74). Without it the pod counted as Ready as soon as the
        # container started, and the first requests after the l54 rollouts got
        # 502 or hung. tcpSocket, not httpGet: every path answers an anonymous
        # request with 401, which httpGet counts as a failure, and the probe
        # must not carry credentials.
        readinessProbe:
          tcpSocket:
            port: 8080
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3
        # Liveness stays on the NFS sentinel only: restart the pod when the
        # NFS mount vanished and the local-XFS shadow shows through.
        livenessProbe:
          exec:
            command: ["test", "-f", "/var/www/webdav/.nfs-sentinel"]
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
          timeoutSeconds: 5
        # On deletion the EndpointSlice marks the pod terminating (not ready)
        # at once, but Traefik drops it from its backend list a moment later.
        # Keep httpd serving for 10 s so requests routed in that window still
        # get an answer; only then does the kubelet send the image's STOPSIGNAL
        # (SIGWINCH, a graceful httpd stop that finishes running requests).
        lifecycle:
          preStop:
            sleep:
              seconds: 10
        volumeMounts:
        - name: webdav-data
          mountPath: /var/www/webdav
        - name: webdav-config
          mountPath: /usr/local/apache2/conf/extra/httpd-dav.conf
          subPath: httpd-dav.conf
        - name: webdav-htpasswd
          mountPath: /etc/apache2/webdav.htpasswd
          subPath: webdav.htpasswd
        - name: webdav-lock
          mountPath: /var/lock
        - name: apache-conf
          mountPath: /usr/local/apache2/conf
        - name: apache-logs
          mountPath: /usr/local/apache2/logs
      # 10 s preStop sleep plus the former 30 s default for httpd's graceful
      # stop to finish running transfers before the kubelet kills it.
      terminationGracePeriodSeconds: 40
      volumes:
      - name: webdav-data
        persistentVolumeClaim:
          claimName: filebrowser-data-pvc
      - name: webdav-config
        configMap:
          name: webdav-config
      - name: webdav-htpasswd
        secret:
          secretName: webdav-htpasswd
      - name: webdav-lock
        emptyDir: {}
      - name: apache-conf
        emptyDir: {}
      - name: apache-logs
        emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: webdav-config
  namespace: services
data:
  httpd-dav.conf: |
    LoadModule dav_module modules/mod_dav.so
    LoadModule dav_fs_module modules/mod_dav_fs.so
    LoadModule auth_basic_module modules/mod_auth_basic.so
    LoadModule authn_file_module modules/mod_authn_file.so
    LoadModule authz_user_module modules/mod_authz_user.so

    DavLockDB /var/lock/apache2/DavLock
    DocumentRoot "/var/www/webdav"

    <Directory "/var/www/webdav">
        Dav On
        Options Indexes FollowSymLinks

        AuthType Basic
        AuthName "WebDAV"
        AuthUserFile /etc/apache2/webdav.htpasswd
        Require valid-user
    </Directory>
