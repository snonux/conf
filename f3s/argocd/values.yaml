# ArgoCD Helm Chart Values Override
# Following f3s cluster patterns: non-HA, single instance deployment

global:
  domain: argocd.f3s.buetow.org

# Disable HA mode - following cluster pattern
redis-ha:
  enabled: false

# Use standard Redis with authentication
redis:
  enabled: true
  # Memory from the 14-day peak working set (36Mi), limit well above it
  # (audit 2026-09-25 #19).
  resources:
    requests:
      memory: 64Mi
    limits:
      memory: 256Mi
  # The chart ships the redis probes disabled; enable them so a hung redis is
  # restarted instead of silently breaking the controller cache (audit
  # 2026-09-25 #20). Chart defaults for the timings (30s delay, 15s period).
  livenessProbe:
    enabled: true
  readinessProbe:
    enabled: true

# Controller configuration (manages k8s resources)
controller:
  replicas: 1
  # Memory from the 14-day peak working set (736Mi), limit well above it: an
  # OOM-killed controller stops all GitOps syncs (audit 2026-09-25 #19).
  resources:
    requests:
      memory: 768Mi
    limits:
      memory: 2Gi
  # Enable metrics for Prometheus integration
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: cicd
      additionalLabels:
        release: prometheus

# Server configuration (API/Web UI)
server:
  replicas: 1
  # Run in insecure mode - TLS termination at ingress
  insecure: true
  # Disable built-in ingress - using separate manifest
  ingress:
    enabled: false
  # Resource limits
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  # Enable metrics for Prometheus integration
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: cicd
      additionalLabels:
        release: prometheus

# Repo Server configuration (clones repos, generates manifests)
repoServer:
  replicas: 1
  # Increase liveness probe timeout to prevent restarts during slow health checks
  livenessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
  readinessProbe:
    timeoutSeconds: 5
    failureThreshold: 5
  # Enable persistence for repo cache - mount PVC at /home/argocd/repo-cache
  volumes:
    - name: repo-server-data
      persistentVolumeClaim:
        claimName: argocd-repo-server-pvc
  volumeMounts:
    - name: repo-server-data
      mountPath: /home/argocd/repo-cache
  # Configure repo-server to use the persistent cache directory
  env:
    - name: XDG_CACHE_HOME
      value: /home/argocd/repo-cache
  # Resource limits. No CPU limit: manifest generation (helm template for ~30
  # apps after each forgejo poll) is short multi-threaded bursts, and a 500m
  # limit throttled ~18% of CFS periods and kept CPUThrottlingHigh pending/
  # firing although average use is ~0.05 cores (audit 2026-09-26). The CPU
  # request still reserves its scheduling share; memory stays capped.
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  # Enable metrics for Prometheus integration
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      namespace: cicd
      additionalLabels:
        release: prometheus

# ApplicationSet controller (multi-app management)
applicationSet:
  replicas: 1
  # Memory from the 14-day peak working set (155Mi), limit well above it
  # (audit 2026-09-25 #19).
  resources:
    requests:
      memory: 192Mi
    limits:
      memory: 512Mi
  # The chart ships these disabled; enable its TCP probe on the health port
  # (audit 2026-09-25 #20). The 1s chart timeout is too tight for this
  # cluster (repo-server probes needed 5s too), so use 5s.
  livenessProbe:
    enabled: true
    timeoutSeconds: 5
  readinessProbe:
    enabled: true
    timeoutSeconds: 5

# Notifications controller - disabled
notifications:
  enabled: false

# Dex (SSO/OAuth) - disabled for simplicity
dex:
  enabled: false

# CRD installation
crds:
  install: true
  keep: true

# Server configuration parameters - run in insecure mode
configs:
  params:
    server.insecure: true
  # Note: argocdServerAdminPassword is NOT set (left empty)
  # This means:
  # - helm install: Generates random password in argocd-initial-admin-secret
  # - helm upgrade: Does NOT reset the password (preserves user changes)
  # - helm uninstall: Deletes secret along with all resources
