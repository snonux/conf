# Beets configuration injected as /etc/beets/config.yaml inside the CronJob
# container (BEETSDIR=/etc/beets). The library DB lives on the PVC at
# /state/library.db so it survives across runs while the config itself stays
# declarative in git.
#
# Design notes:
#   - directory: /music is the same path Navidrome sees (hostPath PV mount).
#   - import.copy/move: no -> never relocate Navidrome's tree; only register
#     paths and (with auto fetchart/embedart) attach art.
#   - import.write: yes -> let beets write tags it learns (mostly a no-op
#     here because we pass -A on the CLI to skip autotagging).
#   - import.incremental: yes -> beets remembers which directories it has
#     already imported, so subsequent runs only touch new albums.
#   - fetchart/embedart auto: yes -> the import pass alone covers new music.
#     The explicit `beet fetchart`/`beet embedart` invocations in the
#     CronJob command are the *backfill* sweep for albums that previously
#     failed art lookup.
#   - embedart.compare_threshold: 0 + embedart.ifempty: yes -> embed only
#     where art is missing. The similarity comparison is broken with
#     ImageMagick 7 (see the embedart section below) and, while it ran,
#     cost ~2.5h of no-op churn per sweep on whichever host landed the
#     job. Existing embeds are never overwritten; to re-embed after a
#     deliberate cover.jpg change use `just shell`, then
#     `beet clearart -- album:X` + `beet embedart -f cover.jpg -- album:X`.
#   - embedart.remove_art_file: no -> keep cover.jpg in the album folder
#     too; Navidrome serves it directly without decoding tags, and cmus /
#     file managers benefit.
apiVersion: v1
kind: ConfigMap
metadata:
  name: beets-art-config
  namespace: services
data:
  config.yaml: |
    directory: /music
    library: /state/library.db

    plugins: fetchart embedart

    import:
      copy: no
      move: no
      write: yes
      incremental: yes
      quiet_fallback: asis
      detail: no
      log: /state/import.log

    fetchart:
      auto: yes
      cautious: yes
      # YAML lists, not space-separated strings: beets 2.x rejects
      # `sources: coverart itunes ...` with UnknownPairError and the
      # whole fetchart plugin fails to load (silently degrades to "no art
      # ever fetched"). Same shape used for cover_names defensively.
      cover_names:
        - cover
        - front
        - folder
        - album
      sources:
        - coverart
        - itunes
        - amazon
        - albumart
      maxwidth: 1200
      enforce_ratio: no
      store_source: yes

    embedart:
      auto: yes
      maxwidth: 1200
      # Comparison disabled 2026-11-22. With beets 2.14.1 + ImageMagick
      # 7.1.2-35 (this image), comparing identical images always fails:
      # IM writes the PHASH metric to stderr and exits 0, but beets reads
      # stdout on the exit-0 path (artresizer.py IMBackend.compare), gets
      # '' and returns None — so every already-embedded track logged
      # "Error while checking art similarity; skipping." (1296/run) and
      # the sweep burned ~1 core for ~2.5h extracting art it then
      # skipped. compare_threshold: 0 skips the comparison entirely;
      # ifempty: yes then makes the backfill a cheap gap-filler: one tag
      # read per track, embed only where art is missing (all embeds are
      # byte-identical to their cover.jpg, so nothing is lost).
      compare_threshold: 0
      ifempty: yes
      remove_art_file: no
