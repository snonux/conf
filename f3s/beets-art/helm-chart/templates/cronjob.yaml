# beets-art: nightly sweep that fetches and embeds cover art for every
# album in the Navidrome music library, then lets Navidrome's own hourly
# scan (ND_SCANSCHEDULE=1h) pick the changes up.
#
# Why this works alongside Navidrome:
#   - The music volume is an NFS hostPath PV. Kubernetes does not enforce
#     RWO for hostPath, and the NFS export is mounted on every r-node, so
#     this CronJob and Navidrome can run on different nodes at once. Nothing
#     is pinned to a node (house rule since 2026-09-25).
#   - Navidrome and beets only conflict on file *write* if they touch the
#     same file at the same instant. Navidrome writes nothing under /music
#     (read-only consumer); beets writes art into album folders and embeds
#     into audio files. No real contention.
#
# Why it is safe to re-run forever:
#   - import.incremental: yes -> already-imported album folders are skipped.
#   - fetchart skips albums that already have a cover image.
#   - embedart with ifempty: no + compare_threshold: 50 only embeds where
#     missing, and refuses risky overwrites.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: beets-art
  namespace: services
spec:
  # Noon local time. timeZone is GA in k8s 1.27+; k3s 1.32 supports it.
  schedule: "0 12 * * *"
  timeZone: Europe/Sofia
  # Forbid stacking: a long backfill run must not get a second worker on
  # top of it (would race on the SQLite library DB).
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # One retry, for f3s power-offs: a run killed by a cluster shutdown
      # comes back after boot as a failed pod (containerd: exit 255, reason
      # Unknown; graceful node shutdown is off, shutdownGracePeriod 0s, so
      # no DisruptionTarget condition a podFailurePolicy could match).
      # With backoffLimit 0 that failed the Job, left ArgoCD Degraded until
      # the next success and fired KubeJobFailed (2026-10-31). The retry
      # does not hammer Cover Art Archive: the script below swallows every
      # step's non-zero exit, so only a killed or crashed pod fails. Pod
      # deadline expiry also gets one retry (at most 2x6h), acceptable for
      # this idempotent sweep.
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          # Cap a runaway run at 6h per POD, not per Job: a Job-level
          # deadline counts from Job creation and would kill the retry pod
          # at once after an outage longer than 6h. A full sweep takes
          # ~2.5h. Real-world test: the next deliberate f3s power-off across
          # the 12:00 run should show a retry pod after boot, no Degraded
          # app and no failed Job.
          activeDeadlineSeconds: 21600
          # Not pinned to any node: the music library is RWX NFS (shared
          # across r0/r1/r2) and the state PVC is now NFS-backed too, so the
          # job may land on any r-node. Letting the scheduler spread it avoids
          # the thermal spike that occurred when it was hard-pinned to r1
          # (on the passively-cooled f1) with a CPU limit of 2.
          containers:
            - name: beets
              # Pinned version tag (linuxserver <beets>-ls<build>): :latest
              # re-pulled from ghcr whenever the image had been garbage-
              # collected from the node and failed the run on a ghcr 429
              # (audit 2026-09-26). Bump deliberately.
              image: lscr.io/linuxserver/beets:2.14.1-ls356
              imagePullPolicy: IfNotPresent
              env:
                # BEETSDIR must be writable: beets stores its incremental
                # import state (state.pickle) there alongside the config.
                # The ConfigMap mount at /etc/beets is read-only (kernel-
                # enforced for ConfigMap volumes), so point BEETSDIR at the
                # state PVC and pass `-c` on each command to load the
                # ConfigMap-supplied config.yaml.
                - name: BEETSDIR
                  value: /state
              # Override the linuxserver s6 entrypoint; we just need the
              # `beet` CLI for a one-shot job. Running as root (the image
              # default when s6 is bypassed) so we can write into the NFS
              # music tree, which Navidrome also writes as root.
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  echo "=== $(date -u) beets-art sweep starting ==="

                  CONF=/etc/beets/config.yaml
                  BEET="beet -c $CONF"

                  # 1. Register any new albums. -A skips autotag (we trust
                  #    the existing tags); auto fetchart/embedart fire here
                  #    for newly imported albums via config.
                  echo "--- import (incremental) ---"
                  $BEET import -A -q --quiet-fallback=asis /music || \
                    echo "import returned non-zero (continuing)"

                  # 2. Backfill external cover.jpg for albums missing it.
                  echo "--- fetchart (backfill) ---"
                  $BEET fetchart || echo "fetchart returned non-zero (continuing)"

                  # 3. Embed art into audio files where missing.
                  # `beet embedart` (no -f) prompts "Modify artwork for N
                  # albums (Y/n)?" with no flag to bypass; pipe `yes` so
                  # it proceeds non-interactively. embedart still respects
                  # ifempty: no and compare_threshold: 50 from config.
                  echo "--- embedart (backfill) ---"
                  yes | $BEET embedart || echo "embedart returned non-zero (continuing)"

                  echo "=== $(date -u) beets-art sweep finished ==="
              volumeMounts:
                - name: music
                  mountPath: /music
                - name: state
                  mountPath: /state
                - name: config
                  mountPath: /etc/beets
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                # Capped at 1 CPU to limit thermal load on the passively-cooled
                # Beelink N100 host (f1). A limit of 2 cores (half the 4-core
                # N100) sustained during the ~28 min fetchart/embedart sweep
                # pushed f1 to ~95 C and tripped the FreebsdCpuTemperatureHigh
                # alert (>=80 C for 5m). Halving the cap roughly halves the
                # sustained heat; the run takes ~2x longer but stays well under
                # the 6h activeDeadlineSeconds. Request stays at 100m so the
                # scheduler still treats it as a light batch job.
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
          volumes:
            - name: music
              persistentVolumeClaim:
                # Reuse the existing Navidrome music PVC — single source of
                # truth for the library tree. It is RWX (shared NFS), so this
                # job can mount it on any r-node alongside Navidrome (which
                # mounts it read-only).
                claimName: navidrome-music-pvc
            - name: state
              persistentVolumeClaim:
                claimName: beets-art-state-pvc
            - name: config
              configMap:
                name: beets-art-config
            - name: tmp
              emptyDir: {}
