apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: syncthing
  namespace: cicd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: http://forgejo.services.svc.cluster.local/snonux/conf.git
    targetRevision: master
    path: f3s/syncthing/helm-chart
  destination:
    server: https://kubernetes.default.svc
    namespace: services
  syncPolicy:
    automated:
      # The v2.1.7-ls236 hold ended once Argo was Synced/Healthy at a
      # published revision with that chart (60f88c2, checked for n44).
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
