apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: cicd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: alloy
    targetRevision: 0.3.2
    helm:
      releaseName: alloy
      valuesObject:
        alloy:
          # Log shipping (to Loki) and trace forwarding (to Tempo) are
          # disabled — Loki and Tempo apps are off. The DaemonSet stays
          # deployed with a no-op config so the chart can be re-enabled
          # by restoring the discovery/loki/otelcol blocks here.
          configMap:
            content: |
              logging {
                level = "info"
              }

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
