apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-rollouts
  namespace: cicd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: 2.43.8
    chart: argo-rollouts
    helm:
      releaseName: argo-rollouts
      valuesObject:
        # Argo Rollouts Helm Chart Values Override
        # Following f3s cluster patterns: single instance deployment

        # Controller configuration
        controller:
          replicas: 1
          # Enable metrics for Prometheus integration
          metrics:
            enabled: true
            serviceMonitor:
              enabled: false  # Will enable if Prometheus available
          # Resource limits
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 250m
              memory: 256Mi

        # Notification controller - disabled
        notifications:
          enabled: false

        # CRD installation
        crds:
          install: true
          keep: true

  destination:
    server: https://kubernetes.default.svc
    namespace: cicd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
