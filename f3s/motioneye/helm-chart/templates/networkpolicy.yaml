apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: motioneye-web
  namespace: services
spec:
  podSelector:
    matchLabels:
      app: motioneye
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-kube-system
      ports:
        - protocol: TCP
          port: 8765
