apiVersion: v1
kind: PersistentVolume
metadata:
  name: motioneye-config-pv
spec:
  storageClassName: ''
  capacity:
    storage: 1Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: services
    name: motioneye-config-pvc
  hostPath:
    path: /data/nfs/k3svolumes/motioneye/config
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: motioneye-config-pvc
  namespace: services
spec:
  storageClassName: ''
  volumeName: motioneye-config-pv
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: motioneye-media-pv
spec:
  storageClassName: ''
  capacity:
    storage: 100Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: services
    name: motioneye-media-pvc
  hostPath:
    path: /data/nfs/k3svolumes/motioneye/media
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: motioneye-media-pvc
  namespace: services
spec:
  storageClassName: ''
  volumeName: motioneye-media-pv
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
