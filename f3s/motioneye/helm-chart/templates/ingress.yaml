apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: motioneye-ingress
  namespace: services
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: eye.f3s.buetow.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: motioneye
                port:
                  number: 8765
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: motioneye-ingress-lan
  namespace: services
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - eye.f3s.lan.buetow.org
      secretName: f3s-lan-tls
  rules:
    - host: eye.f3s.lan.buetow.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: motioneye
                port:
                  number: 8765
