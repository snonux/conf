apiVersion: v1
kind: ConfigMap
metadata:
  name: opodsync-nginx-config
  namespace: services
data:
  nginx.conf: |
    worker_processes  1;
    events { worker_connections  1024; }
    http {
      variables_hash_bucket_size 128;
      include       mime.types;
      default_type  application/octet-stream;
      sendfile        on;
      keepalive_timeout  65;

      upstream backend {
        server 127.0.0.1:8080;
      }

      server {
        listen 8081;

        # Preserve client details
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass every path through unchanged. oPodSync serves its web UI at
        # "/" and its gPodder API under "/api/2/..." and "/index.php/...";
        # it has no "/gpodder" prefix, so rewriting "/" to "/gpodder" (as
        # this proxy used to do) made the landing page a 404.
        location / {
          proxy_pass http://backend;
        }
      }
    }

