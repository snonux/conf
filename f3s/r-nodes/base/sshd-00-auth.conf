# Managed by gonf (task rnodes_base_sshd, gonf/rnodes/base.go).
#
# sshd keeps the first value it reads for a keyword and reads the drop-ins
# in name order before the rest of sshd_config, so this 00- file wins over
# the Anaconda 01-permitrootlogin.conf, 50-redhat.conf and the main file.
#
# Root logs in with a key only: gonf deploys and ops reach r0-r2 as
# root@rN.lan.buetow.org (port 22). Passwords are off.
PermitRootLogin prohibit-password
PasswordAuthentication no
KbdInteractiveAuthentication no
