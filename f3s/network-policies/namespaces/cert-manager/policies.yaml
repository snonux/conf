# Task 7n3: activate only this namespace in the approved staged rollout.
# Each receiver has one complete allow policy; namespace default deny follows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cert-manager-metrics
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  podSelector:
    matchLabels:
      app: cert-manager
      app.kubernetes.io/instance: cert-manager
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
          prometheus: prometheus-kube-prometheus-prometheus
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 9402
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cainjector-metrics
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  podSelector:
    matchLabels:
      app: cainjector
      app.kubernetes.io/instance: cert-manager
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
          prometheus: prometheus-kube-prometheus-prometheus
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 9402
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webhook-metrics
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  podSelector:
    matchLabels:
      app: webhook
      app.kubernetes.io/instance: cert-manager
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
          prometheus: prometheus-kube-prometheus-prometheus
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 9402
  - from:
    - ipBlock:
        cidr: 192.168.1.120/32
    - ipBlock:
        cidr: 192.168.1.121/32
    - ipBlock:
        cidr: 192.168.1.122/32
    - ipBlock:
        cidr: 192.168.2.120/32
    - ipBlock:
        cidr: 192.168.2.121/32
    - ipBlock:
        cidr: 192.168.2.122/32
    - ipBlock:
        cidr: 10.42.0.0/32
    - ipBlock:
        cidr: 10.42.0.1/32
    - ipBlock:
        cidr: 10.42.1.0/32
    - ipBlock:
        cidr: 10.42.1.1/32
    - ipBlock:
        cidr: 10.42.2.0/32
    - ipBlock:
        cidr: 10.42.2.1/32
    ports:
    - protocol: TCP
      port: 10250
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress: []
