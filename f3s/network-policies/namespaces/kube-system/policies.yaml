# Task 7n3: activate only this namespace in the approved staged rollout.
# Each receiver has one complete allow policy; namespace default deny follows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dns
  namespace: kube-system
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  podSelector:
    matchLabels:
      k8s-app: kube-dns
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector: {}
    - ipBlock:
        cidr: 192.168.1.120/32
    - ipBlock:
        cidr: 192.168.1.121/32
    - ipBlock:
        cidr: 192.168.1.122/32
    - ipBlock:
        cidr: 192.168.2.120/32
    - ipBlock:
        cidr: 192.168.2.121/32
    - ipBlock:
        cidr: 192.168.2.122/32
    - ipBlock:
        cidr: 10.42.0.0/32
    - ipBlock:
        cidr: 10.42.0.1/32
    - ipBlock:
        cidr: 10.42.1.0/32
    - ipBlock:
        cidr: 10.42.1.1/32
    - ipBlock:
        cidr: 10.42.2.0/32
    - ipBlock:
        cidr: 10.42.2.1/32
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
          prometheus: prometheus-kube-prometheus-prometheus
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - protocol: TCP
      port: 9153
---
