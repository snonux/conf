---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: cicd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress: []
