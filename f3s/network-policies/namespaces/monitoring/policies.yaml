# Task 7n3: activate only this namespace in the approved staged rollout.
# Each receiver has one complete allow policy; namespace default deny follows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  podSelector:
    matchLabels:
      alertmanager: prometheus-kube-prometheus-alertmanager
      app.kubernetes.io/name: alertmanager
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
          prometheus: prometheus-kube-prometheus-prometheus
    ports:
    - protocol: TCP
      port: 9093
    - protocol: TCP
      port: 8080
  - from:
    - podSelector:
        matchLabels:
          alertmanager: prometheus-kube-prometheus-alertmanager
          app.kubernetes.io/name: alertmanager
    ports:
    - protocol: TCP
      port: 9094
    - protocol: UDP
      port: 9094
---
