# Task 7n3: activate only this namespace in the approved staged rollout.
# Each receiver has one complete allow policy; namespace default deny follows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: player-web
  namespace: player-trash-test
  annotations:
    argocd.argoproj.io/sync-wave: '-1'
spec:
  podSelector:
    matchLabels:
      app: player-trash-test
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
          app.kubernetes.io/instance: traefik-kube-system
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
    ports:
    - protocol: TCP
      port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: player-trash-test
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  ingress: []
