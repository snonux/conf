apiVersion: apps/v1
kind: Deployment
metadata:
  name: xplayer
  namespace: services
spec:
  replicas: 1
  # Recreate so the old pod fully terminates before the new one starts —
  # avoids NFS-lock races on the hostPath-backed PVC during rolling updates.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: xplayer
  template:
    metadata:
      labels:
        app: xplayer
    spec:
      initContainers:
        - name: nfs-check-data
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              test -f /mnt/.nfs-sentinel || (
                echo "ERROR: NFS sentinel missing at /mnt/.nfs-sentinel"
                echo "refusing to start; node likely has NFS unmounted"
                echo "pod would otherwise bind-mount the local-XFS shadow"
                exit 1
              )
          volumeMounts:
            - name: xplayer-data
              mountPath: /mnt
              readOnly: true
        - name: nfs-check-media
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              test -f /mnt/.nfs-sentinel || (
                echo "ERROR: NFS sentinel missing at /mnt/.nfs-sentinel"
                echo "refusing to start; node likely has NFS unmounted"
                echo "pod would otherwise bind-mount the local-XFS shadow"
                exit 1
              )
          volumeMounts:
            - name: xplayer-media
              mountPath: /mnt
              readOnly: true
        - name: nfs-check-thumbnails
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              test -f /mnt/.nfs-sentinel || (
                echo "ERROR: NFS sentinel missing at /mnt/.nfs-sentinel"
                echo "refusing to start; node likely has NFS unmounted"
                echo "pod would otherwise bind-mount the local-XFS shadow"
                exit 1
              )
          volumeMounts:
            - name: xplayer-thumbnails
              mountPath: /mnt
              readOnly: true
        # Each sentinel sits at the library root. The container mounts a
        # subdirectory, which is checked as well: kubelet otherwise creates
        # a missing subPath as an empty directory, and a rescan would then
        # remove all its items from Player.
        - name: nfs-check-libraries
          image: busybox:1.36.1
          command:
            - sh
            - -c
            - |
              # Each check only ends its own subshell; set -e makes the
              # first failing one end the script.
              set -e
              test -f /mnt/.nfs-sentinel || (
                echo "ERROR: NFS sentinel missing at /mnt/.nfs-sentinel"
                echo "refusing to start; node likely has NFS unmounted"
                echo "pod would otherwise bind-mount the local-XFS shadow"
                exit 1
              )
              test -d "/mnt/ai" || (
                echo "ERROR: library directory /mnt/ai is missing"
                echo "refusing to start; kubelet would create the subPath"
                echo "inside the library and serve an empty set"
                exit 1
              )
              test -d "/mnt/pictures" || (
                echo "ERROR: library directory /mnt/pictures is missing"
                echo "refusing to start; kubelet would create the subPath"
                echo "inside the library and serve an empty set"
                exit 1
              )
              test -d "/mnt/videos" || (
                echo "ERROR: library directory /mnt/videos is missing"
                echo "refusing to start; kubelet would create the subPath"
                echo "inside the library and serve an empty set"
                exit 1
              )
          volumeMounts:
            - name: xplayer-libraries
              mountPath: /mnt
              readOnly: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: xplayer
          image: registry.lan.buetow.org:30001/player:93f2c60
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: DB_PATH
              value: "/data/media.db"
            - name: MEDIA_ROOT
              value: "/media"
            - name: SECURE_COOKIES
              value: "true"
            # All generated thumbnails go to their own volume instead of a
            # .thumbnails directory next to each media file, so the
            # read-only library sets below get thumbnails too.
            - name: THUMBNAIL_CACHE_DIR
              value: "/thumbnails"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            # The 1s default times out while a rescan keeps the single CPU
            # busy with ffprobe/ffmpeg.
            timeoutSeconds: 5
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            timeoutSeconds: 5
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              memory: 128Mi
              cpu: 100m
            limits:
              # One ffmpeg transcode (legacy formats, TRANSCODE_MAX_JOBS=1)
              # needs about 400 MB next to the server itself.
              memory: 1Gi
              cpu: "1"
          volumeMounts:
            - name: xplayer-data
              mountPath: /data
            - name: xplayer-thumbnails
              mountPath: /thumbnails
            - name: xplayer-media
              mountPath: /media
            # Libraries as media sets: the directory name
            # under /media is the set name. Read-only, so Player can neither
            # write into them nor delete a file when an item is removed in
            # the UI; their thumbnails live in /thumbnails. The mount point
            # directories exist in the media volume on NFS.
            - name: xplayer-libraries
              mountPath: /media/AI
              subPath: ai
              readOnly: true
            - name: xplayer-libraries
              mountPath: /media/Pictures
              subPath: pictures
              readOnly: true
            - name: xplayer-libraries
              mountPath: /media/Videos
              subPath: videos
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: xplayer-data
          persistentVolumeClaim:
            claimName: xplayer-data-pvc
        - name: xplayer-media
          persistentVolumeClaim:
            claimName: xplayer-media-pvc
        - name: xplayer-thumbnails
          persistentVolumeClaim:
            claimName: xplayer-thumbnails-pvc
        - name: xplayer-libraries
          persistentVolumeClaim:
            claimName: xplayer-content-pvc
            readOnly: true
        - name: tmp
          emptyDir: {}
