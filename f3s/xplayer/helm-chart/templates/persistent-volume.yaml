apiVersion: v1
kind: PersistentVolume
metadata:
  name: xplayer-data-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/nfs/k3svolumes/xplayer/data
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xplayer-data-pvc
  namespace: services
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: xplayer-media-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/nfs/k3svolumes/xplayer/media
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xplayer-media-pvc
  namespace: services
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# Generated thumbnails (THUMBNAIL_CACHE_DIR). They get a volume of their own
# because the library sets below are read-only: Player cannot keep
# thumbnails next to those media files, and must not write into them.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: xplayer-thumbnails-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: services
    name: xplayer-thumbnails-pvc
  hostPath:
    path: /data/nfs/k3svolumes/xplayer/thumbnails
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xplayer-thumbnails-pvc
  namespace: services
spec:
  storageClassName: ""
  volumeName: xplayer-thumbnails-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# Xplayer-owned libraries, mounted read-only as AI, Pictures and Videos.
# The root sentinel and each subdirectory are checked before mounting subPaths.
# Use a new PV/PVC pair when moving storage; bound PV paths are immutable.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: xplayer-content-pv
spec:
  capacity:
    storage: 500Gi
  volumeMode: Filesystem
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  # Bind explicitly so the claim cannot select a different same-sized PV.
  claimRef:
    namespace: services
    name: xplayer-content-pvc
  hostPath:
    path: /data/nfs/k3svolumes/xplayer/libraries
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xplayer-content-pvc
  namespace: services
spec:
  storageClassName: ""
  volumeName: xplayer-content-pv
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 500Gi
