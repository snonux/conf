apiVersion: v1
kind: PersistentVolume
metadata:
  name: xplayer-data-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/nfs/k3svolumes/xplayer/data
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xplayer-data-pvc
  namespace: services
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: xplayer-media-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/nfs/k3svolumes/xplayer/media
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xplayer-media-pvc
  namespace: services
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# Generated thumbnails (THUMBNAIL_CACHE_DIR). They get a volume of their own
# because the library sets below are read-only: Player cannot keep
# thumbnails next to those media files, and must not write into them.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: xplayer-thumbnails-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  claimRef:
    namespace: services
    name: xplayer-thumbnails-pvc
  hostPath:
    path: /data/nfs/k3svolumes/xplayer/thumbnails
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xplayer-thumbnails-pvc
  namespace: services
spec:
  storageClassName: ""
  volumeName: xplayer-thumbnails-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# The Jellyfin libraries, mounted read-only: xman/{ai,pictures,videos} are
# the media sets "AI", "Pictures" and "Videos".
#
# The PV points at the directory the Jellyfin chart uses as its PV root,
# because that is where the .nfs-sentinel file lives (see
# docs/nfs-sentinel-initcontainer.md). The deployment mounts the wanted
# subdirectories with subPath, so nothing is copied or moved. Its init
# container refuses to start the pod when such a subdirectory is missing,
# because kubelet would otherwise create it.
#
# hostPath and the claim binding are immutable: to point a set elsewhere,
# stop the pod and delete the PV and PVC by hand before syncing the change.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: xplayer-libraries-pv
spec:
  capacity:
    storage: 500Gi
  volumeMode: Filesystem
  accessModes:
    - ReadOnlyMany
  persistentVolumeReclaimPolicy: Retain
  # Pre-bound both ways (claimRef here, volumeName on the claim): this PV
  # shares its hostPath with the Jellyfin chart's PV, so neither side may be
  # left to the binder's capacity matching.
  claimRef:
    namespace: services
    name: xplayer-libraries-pvc
  hostPath:
    path: /data/nfs/k3svolumes/jellyfin/libraries
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: xplayer-libraries-pvc
  namespace: services
spec:
  storageClassName: ""
  volumeName: xplayer-libraries-pv
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 500Gi
