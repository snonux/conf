apiVersion: apps/v1
kind: Deployment
metadata:
  name: ychat
  namespace: services
spec:
  replicas: 1
  # Recreate: single-instance stateful-in-memory chat; avoid two pods racing
  # for the same Service while the old one drains its sessions.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ychat
  template:
    metadata:
      labels:
        app: ychat
    spec:
      initContainers:
        - name: nfs-check-data
          image: busybox:stable
          command:
            - sh
            - -c
            - |
              test -f /mnt/.nfs-sentinel || (
                echo "ERROR: NFS sentinel missing at /mnt/.nfs-sentinel"
                echo "refusing to start; node likely has NFS unmounted"
                echo "pod would otherwise bind-mount the local-XFS shadow"
                exit 1
              )
          volumeMounts:
            - name: data
              mountPath: /mnt
              readOnly: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: ychat
          # SQLite is now mandatory (see ychat/DOCKER.md); the image tag tracks
          # the ychat repo commit that build was cut from.
          image: registry.lan.buetow.org:30001/ychat:f015a1b
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - containerPort: 2000
              name: http
          # HTTP probes only, never tcpSocket: old builds segfaulted on an
          # empty TCP open+close (f015a1b survives it, but a real GET is the
          # safer check). The liveness probe matters: a "POST / " without an
          # event parameter sends f015a1b into an endless loop in its
          # single-threaded event loop, so the whole chat stops answering
          # until the 128Mi limit OOM-kills it (seen as repeated OOMKilled
          # restarts). The probe restarts it after ~1 minute instead
          # (audit 2026-09-25 #20).
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 128Mi
              cpu: 250m
          volumeMounts:
            - name: log
              mountPath: /app/log
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
      volumes:
        - name: log
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: ychat-data-pvc
