apiVersion: apps/v1
kind: Deployment
metadata:
  name: ychat
  namespace: services
spec:
  replicas: 1
  # Recreate: single-instance stateful-in-memory chat; avoid two pods racing
  # for the same Service while the old one drains its sessions.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ychat
  template:
    metadata:
      labels:
        app: ychat
    spec:
      initContainers:
        - name: nfs-check-data
          image: busybox:stable
          command:
            - sh
            - -c
            - |
              test -f /mnt/.nfs-sentinel || (
                echo "ERROR: NFS sentinel missing at /mnt/.nfs-sentinel"
                echo "refusing to start; node likely has NFS unmounted"
                echo "pod would otherwise bind-mount the local-XFS shadow"
                exit 1
              )
          volumeMounts:
            - name: data
              mountPath: /mnt
              readOnly: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: ychat
          # SQLite is now mandatory (see ychat/DOCKER.md); the image tag tracks
          # the ychat repo commit that build was cut from.
          image: registry.lan.buetow.org:30001/ychat:fdb28f8
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - containerPort: 2000
              name: http
          # HTTP probes only, never tcpSocket: old builds segfaulted on an
          # empty TCP open+close (current builds survive it, but a real GET
          # is the safer check). Builds up to f015a1b also hung on a
          # "POST /" without an event parameter (or any request for a
          # directory): the template directory was read in an endless loop
          # until the 128Mi limit OOM-killed the pod. Fixed in ychat
          # fdb28f8 (correct request-target parsing; only bounded regular
          # files are served). Readiness still takes a wedged pod out of the
          # Service and liveness restarts it, as a safety net for any
          # future hang of the single-threaded event loop.
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: 32Mi
              cpu: 25m
            limits:
              memory: 128Mi
              cpu: 250m
          volumeMounts:
            - name: log
              mountPath: /app/log
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /app/data
      volumes:
        - name: log
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: ychat-data-pvc
