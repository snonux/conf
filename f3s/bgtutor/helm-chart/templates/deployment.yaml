apiVersion: apps/v1
kind: Deployment
metadata:
  name: bgtutor
  namespace: services
spec:
  replicas: 1
  # Recreate so the old pod fully terminates before the new one starts —
  # avoids NFS-lock races on the hostPath-backed PVC during rolling updates,
  # and keeps a single writer for vocabulary and citizenship progress.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bgtutor
  template:
    metadata:
      labels:
        app: bgtutor
    spec:
      # Every container runs as the cluster's NFS data-writer identity 1000:1000
      # (same as forgejo/keybr). The NFS server owns only data/vocabulary and
      # data/citizenship-progress as 1000:1000; data/, episodes/ and the
      # prepared citizenship-test/ stay owned by others and are read-only to
      # this UID. fsGroup is deliberately unset: kubelet does not chown hostPath
      # PVs, so ownership is managed on the NFS server instead (task c44).
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: nfs-check-data
        image: busybox:1.36.1
        command:
        - sh
        - -c
        - |
          test -f /mnt/.nfs-sentinel || (
            echo "ERROR: NFS sentinel missing at /mnt/.nfs-sentinel"
            echo "refusing to start; node likely has NFS unmounted"
            echo "pod would otherwise bind-mount the local-XFS shadow"
            exit 1
          )
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: bgtutor-data
          mountPath: /mnt
          readOnly: true
      # Fail before serving if uploaded citizenship assets are incomplete.
      - name: validate-citizenship
        image: registry.lan.buetow.org:30001/bgtutor:0.30.0-runtime20261108-sdk141
        command: ["/usr/local/bin/bgtutor", "validate"]
        args: ["--mode", "citizenship", "--data-dir", "/data"]
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: bgtutor-data
          mountPath: /data
          readOnly: true
      containers:
      - name: bgtutor
        image: registry.lan.buetow.org:30001/bgtutor:0.30.0-runtime20261108-sdk141
        imagePullPolicy: Always
        # The image entrypoint is "bgtutor serve"; BGTUTOR_DATA_DIR and
        # BGTUTOR_ADDR are set here explicitly so the chart documents them.
        env:
        - name: BGTUTOR_MODE
          value: citizenship
        - name: BGTUTOR_DATA_DIR
          value: /data
        - name: BGTUTOR_ADDR
          value: ":8080"
        # Required: serve refuses a non-localhost address without a token.
        # The secret is created by hand, see f3s/bgtutor/README.md.
        - name: BGTUTOR_TOKEN
          valueFrom:
            secretKeyRef:
              name: bgtutor-secret
              key: BGTUTOR_TOKEN
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        # Runs as the pod-level UID/GID 1000; it writes only vocabulary/ and
        # citizenship-progress/, which are owned by that identity on NFS.
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: bgtutor-data
          mountPath: /data
      volumes:
      - name: bgtutor-data
        persistentVolumeClaim:
          claimName: bgtutor-data-pvc
