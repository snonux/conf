apiVersion: apps/v1
kind: Deployment
metadata:
  name: bgtutor
  namespace: services
spec:
  replicas: 1
  # Recreate so the old pod fully terminates before the new one starts —
  # avoids NFS-lock races on the hostPath-backed PVC during rolling updates,
  # and keeps a single writer for vocabulary/saved.json.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bgtutor
  template:
    metadata:
      labels:
        app: bgtutor
    spec:
      initContainers:
      - name: nfs-check-data
        image: busybox:stable
        command:
        - sh
        - -c
        - |
          test -f /mnt/.nfs-sentinel || (
            echo "ERROR: NFS sentinel missing at /mnt/.nfs-sentinel"
            echo "refusing to start; node likely has NFS unmounted"
            echo "pod would otherwise bind-mount the local-XFS shadow"
            exit 1
          )
        volumeMounts:
        - name: bgtutor-data
          mountPath: /mnt
          readOnly: true
      containers:
      - name: bgtutor
        image: registry.lan.buetow.org:30001/bgtutor:0.1.0
        imagePullPolicy: Always
        # The image entrypoint is "bgtutor serve"; BGTUTOR_DATA_DIR and
        # BGTUTOR_ADDR are set here explicitly so the chart documents them.
        env:
        - name: BGTUTOR_DATA_DIR
          value: /data
        - name: BGTUTOR_ADDR
          value: ":8080"
        # Required: serve refuses a non-localhost address without a token.
        # The secret is created by hand, see f3s/bgtutor/README.md.
        - name: BGTUTOR_TOKEN
          valueFrom:
            secretKeyRef:
              name: bgtutor-secret
              key: BGTUTOR_TOKEN
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 20
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "128Mi"
            cpu: "250m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          # root so it can write vocabulary/ on the NFS export, same as
          # goprecords; the binary itself needs no privileges.
          runAsUser: 0
          runAsGroup: 0
        volumeMounts:
        - name: bgtutor-data
          mountPath: /data
      volumes:
      - name: bgtutor-data
        persistentVolumeClaim:
          claimName: bgtutor-data-pvc
