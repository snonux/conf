apiVersion: v1
kind: PersistentVolume
metadata:
  name: bgtutor-data-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    # Holds prepared episodes/citizenship-test and personal vocabulary/progress.
    path: /data/nfs/k3svolumes/bgtutor/data
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: bgtutor-data-pvc
  namespace: services
spec:
  storageClassName: ""
  volumeName: bgtutor-data-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
