# Pi-hole on pi2/pi3 (~paul/pihole/docker-compose.yml), deployed by gonf
# (pihole_compose). TZ/WEBPASSWORD/DNS1/DNS2 come from the host-local
# ~/pihole/.env, which is not in git. The image is pinned: bump the tag
# here deliberately and deploy one Pi at a time (see f3s/pihole/README.md).
services:
  pihole:
    image: pihole/pihole:2026.10.1
    container_name: pihole
    network_mode: host
    environment:
      TZ: ${TZ}
      WEBPASSWORD: ${WEBPASSWORD}
      DNS1: ${DNS1}
      DNS2: ${DNS2}
      # Routed VPN clients are admitted by the host's scoped source guard.
      FTLCONF_dns_listeningMode: 'SINGLE'
      FTLCONF_dns_interface: 'eth0'
      FTLCONF_dns_localTTL: '60'
      FTLCONF_misc_etc_dnsmasq_d: 'true'
    volumes:
      - ./etc-pihole:/etc/pihole
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
