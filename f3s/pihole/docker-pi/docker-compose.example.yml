# Reference for pi2 / pi3 (~paul/pihole). Merge the `dnsmasq.d` volume with your live compose.
# WEBPASSWORD lives in host-local `.env` (not in git). See f3s/pihole/README.md.
services:
  pihole:
    image: pihole/pihole:2026.04.0  # pinned; bump the tag deliberately, one Pi at a time
    network_mode: host
    env_file:
      - .env
    environment:
      TZ: Europe/Sofia
      DNS1: 1.1.1.1
      DNS2: 1.0.0.1
    volumes:
      # Production Pis use ./etc-dnsmasq.d; same content as docker-pi/dnsmasq.d/ here.
      - ./etc-dnsmasq.d:/etc/dnsmasq.d:ro
