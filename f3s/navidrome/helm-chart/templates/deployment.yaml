apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: services
spec:
  replicas: 1
  # SQLite DB on an RWO NFS PVC: only one writer at a time. Use Recreate so the
  # old pod releases the DB lock before the new pod starts; otherwise the
  # new pod blocks indefinitely on the SQLite open.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      initContainers:
      - name: nfs-check
        image: busybox:stable
        command:
        - sh
        - -c
        - |
          # Both volumes are NFS: the SQLite DB under /data since 2026-09-25.
          for m in /mnt /data; do
            test -f $m/.nfs-sentinel || {
              echo "ERROR: NFS sentinel missing at $m/.nfs-sentinel"
              echo "refusing to start; node likely has NFS unmounted"
              exit 1
            }
          done
        volumeMounts:
        - name: navidrome-music
          mountPath: /mnt
          readOnly: true
        - name: navidrome-data
          mountPath: /data
          readOnly: true
      # No nodeSelector: /data and /music are both on the NFS export that is
      # mounted on every r-node, so the pod can run on r0, r1 or r2. The
      # init container above refuses to start on a node without the mount
      # (.nfs-sentinel in both directories).
      containers:
      - name: navidrome
        image: deluan/navidrome:0.61.2
        # Memory from the 14-day peak working set (67Mi), limit well above
        # it so normal spikes are never OOM-killed (audit 2026-09-25 #19).
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 1Gi
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4533
        env:
        - name: ND_SCANSCHEDULE
          value: "1h"
        - name: ND_LOGLEVEL
          value: "info"
        - name: ND_BASEURL
          value: ""
        # Keep the image/transcoding cache off NFS (it defaults to
        # /data/cache): node-local reads keep startup and thumbnails fast.
        # The cache is disposable and is rebuilt on demand after a restart.
        - name: ND_CACHEFOLDER
          value: /cache
        startupProbe:
          httpGet:
            path: /ping
            port: 4533
          # Allow up to 5 min for cold start (DB open, first scan, etc.)
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /ping
            port: 4533
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        # Liveness follows the house NFS pattern: the SQLite DB is on NFS, and
        # after an NFS server restart or CARP failover its handles go ESTALE
        # while /ping keeps answering, so only a file check on the mount
        # notices; a restart re-binds the healthy mount.
        livenessProbe:
          exec:
            command: ["test", "-f", "/data/.nfs-sentinel"]
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: navidrome-data
          mountPath: /data
        - name: navidrome-music
          mountPath: /music
        - name: navidrome-cache
          mountPath: /cache
      volumes:
      - name: navidrome-data
        persistentVolumeClaim:
          claimName: navidrome-data-nfs-pvc
      # Node-local scratch for the disposable cache (see ND_CACHEFOLDER).
      # Navidrome caps its image and transcoding caches at 100 MB each by
      # default; the limit leaves headroom without letting it fill the disk.
      - name: navidrome-cache
        emptyDir:
          sizeLimit: 1Gi
      - name: navidrome-music
        persistentVolumeClaim:
          claimName: navidrome-music-pvc
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: navidrome
  name: navidrome-service
  namespace: services
spec:
  ports:
    - name: web
      port: 4533
      protocol: TCP
      targetPort: 4533
  selector:
    app: navidrome
