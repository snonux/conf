apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: services
spec:
  replicas: 1
  # SQLite DB on an RWO NFS PVC, opened with vfs=unix-excl (configmap.yaml):
  # the running process holds an exclusive lock on navidrome.db. Recreate
  # stops the old pod before a rollout starts the new one. It does not cover
  # every case: after an eviction, a drain or a node partition a replacement
  # pod can start while the old process still holds the lock (until it exits
  # or its NFSv4 lease expires). That pod fails with "database is locked" and
  # restarts until the lock is free; it cannot open the DB in parallel.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
      annotations:
        # Restart the pod when the config file (DbPath) changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      initContainers:
      - name: nfs-check
        image: busybox:1.36.1
        command:
        - sh
        - -c
        - |
          # Both volumes are NFS: the SQLite DB under /data since 2026-09-25.
          for m in /mnt /data; do
            test -f $m/.nfs-sentinel || {
              echo "ERROR: NFS sentinel missing at $m/.nfs-sentinel"
              echo "refusing to start; node likely has NFS unmounted"
              exit 1
            }
          done
        volumeMounts:
        - name: navidrome-music
          mountPath: /mnt
          readOnly: true
        - name: navidrome-data
          mountPath: /data
          readOnly: true
      # No nodeSelector: /data and /music are both on the NFS export that is
      # mounted on every r-node, so the pod can run on r0, r1 or r2. The
      # init container above refuses to start on a node without the mount
      # (.nfs-sentinel in both directories).
      containers:
      - name: navidrome
        # 0.64.2 needs the unix-excl DbPath from configmap.yaml on this NFS
        # DB; with the default DSN it stalls logins (task 444, see README).
        # Pinned by digest. Rollback to 0.63.2 needs the pre-upgrade database
        # backup as well, because 0.64 migrates the schema.
        image: deluan/navidrome:0.64.2@sha256:38dc2727bfcfd5ede290f8ada114fc90368146f265ae4701ddddbcbe2a44ee52
        # Memory from the 14-day peak working set (67Mi), limit well above
        # it so normal spikes are never OOM-killed (audit 2026-09-25 #19).
        resources:
          requests:
            memory: 128Mi
          limits:
            memory: 1Gi
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 4533
        env:
        - name: ND_SCANSCHEDULE
          value: "1h"
        # Preserve the pre-0.63 default: public sharing stays opt-in.
        - name: ND_ENABLESHARING
          value: "false"
        - name: ND_LOGLEVEL
          value: "info"
        - name: ND_BASEURL
          value: ""
        # Keep the image/transcoding cache off NFS (it defaults to
        # /data/cache): node-local reads keep startup and thumbnails fast.
        # The cache is disposable and is rebuilt on demand after a restart.
        - name: ND_CACHEFOLDER
          value: /cache
        # DbPath lives in the config file: ND_DBPATH is ignored by 0.64.2.
        - name: ND_CONFIGFILE
          value: /config/navidrome.toml
        # Scan inside the server process. The default external scanner is a
        # second process, which cannot open the exclusively locked DB.
        - name: ND_DEVEXTERNALSCANNER
          value: "false"
        startupProbe:
          httpGet:
            path: /ping
            port: 4533
          # Allow up to 5 min for cold start (DB open, first scan, etc.)
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /ping
            port: 4533
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        # Liveness follows the house NFS pattern: the SQLite DB is on NFS, and
        # after an NFS server restart or CARP failover its handles go ESTALE
        # while /ping keeps answering, so only a file check on the mount
        # notices; a restart re-binds the healthy mount.
        livenessProbe:
          exec:
            command: ["test", "-f", "/data/.nfs-sentinel"]
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        volumeMounts:
        - name: navidrome-data
          mountPath: /data
        - name: navidrome-music
          mountPath: /music
        - name: navidrome-cache
          mountPath: /cache
        - name: navidrome-config
          mountPath: /config
          readOnly: true
      volumes:
      - name: navidrome-data
        persistentVolumeClaim:
          claimName: navidrome-data-nfs-pvc
      # Node-local scratch for the disposable cache (see ND_CACHEFOLDER).
      # Navidrome caps its image and transcoding caches at 100 MB each by
      # default; the limit leaves headroom without letting it fill the disk.
      - name: navidrome-cache
        emptyDir:
          sizeLimit: 1Gi
      - name: navidrome-music
        persistentVolumeClaim:
          claimName: navidrome-music-pvc
      - name: navidrome-config
        configMap:
          name: navidrome-config
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: navidrome
  name: navidrome-service
  namespace: services
spec:
  ports:
    - name: web
      port: 4533
      protocol: TCP
      targetPort: 4533
  selector:
    app: navidrome
