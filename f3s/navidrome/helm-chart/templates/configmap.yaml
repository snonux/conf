# Navidrome config file (ND_CONFIGFILE in deployment.yaml).
#
# DbPath must be set here, not as ND_DBPATH: Navidrome 0.64.2 registers no
# viper default for "dbpath", so the environment variable is silently ignored.
#
# Scanner.Schedule lives here too (task o44). Until 2026-11-09 the chart set
# ND_SCANSCHEDULE=1h, an old key that 0.63 and 0.64 ignore: they logged
# "Periodic scan is DISABLED". Navidrome warns about unknown keys in this
# file ("Option '...' is not recognized") but not about unknown ND_*
# variables, so a future rename shows up in the log here. The value goes
# through robfig/cron (scheduler.ParseCrontab in 0.64.2): a cron spec, a
# descriptor such as "@every 1h", or a bare Go duration ("1h" becomes
# "@every 1h"); "0" disables it. The interval counts from process start.
# The periodic scan is needed because the library watcher uses inotify,
# which on an NFS client sees only changes made on that same node. Music
# copied in on the NFS server or from another node shows up only after the
# next scan. A quick scan of the whole library takes about 3 s over NFS
# (startup scan, 2026-11-09), so an hourly scan costs little.
#
# Why the custom DSN: the SQLite DB lives on the NFS export (NFSv4.2 through
# stunnel, local_lock=none). With SQLite's default "unix" VFS every
# transaction takes and drops POSIX locks on navidrome.db and its WAL index
# (navidrome.db-shm, mmap'd on NFS); each one is an NFS LOCK/LOCKU round trip
# plus a page-cache flush and invalidation. On r1 that caps SQLite at about
# 50 write and 230 point-read transactions per second. 0.63.2 fits in that
# budget; 0.64.2's new artwork queue (~2,800 items after the upgrade) does
# not, and logins and album queries time out (task 444, 2026-11-08).
#
# vfs=unix-excl takes one exclusive POSIX lock on navidrome.db for the life of
# the process and keeps the WAL index in heap memory (no -shm file). The
# pooled connections inside the process still get normal WAL semantics
# (readers alongside one writer, busy_timeout between writers). Same NFS
# copy: ~12,700 writes/s and ~48,000 point reads/s.
#
# Consequences, all intended:
# - The "file:" prefix is not needed for vfs=: go-sqlite3 v1.14.52 reads
#   vfs (and the _-prefixed keys) from the query string with or without it.
#   Only cache=shared needs file:. Upstream's default DSN has no file:, so
#   its cache=shared never took effect and connections were always private.
#   cache=shared stays out on purpose. file: is kept only because this exact
#   string is what passed the task 444 fixtures (/proc/locks: one exclusive
#   lock, no -shm). Dropping it needs that fixture check repeated.
# - synchronous=normal has no effect (go-sqlite3's key is _synchronous). It
#   is kept as tested and is harmless: go-sqlite3 always runs
#   PRAGMA synchronous = NORMAL by default, the value upstream intends.
# - No second process can open the DB while Navidrome runs. That is why
#   ND_DEVEXTERNALSCANNER=false keeps the scanner in-process. The native CLI
#   cannot run alongside the server (kubectl exec into the pod fails), and
#   with the pod stopped backup, doctor and search abort: they call
#   requireExistingDB, which cuts DbPath at "?" and stats
#   "file:/data/navidrome.db", a path that does not exist. The other DB
#   commands (user, pls, missing, plugin, artwork, scan) skip that check and
#   work with the pod stopped.
#   Back up from ZFS snapshots of the NFS dataset, or copy the files with
#   the pod stopped.
# - A second pod cannot share the DB by accident: it fails with "database is
#   locked" and restarts until the old process has released the lock.
apiVersion: v1
kind: ConfigMap
metadata:
  name: navidrome-config
  namespace: services
  labels:
    app: navidrome
data:
  navidrome.toml: |
    DbPath = "file:/data/navidrome.db?vfs=unix-excl&_busy_timeout=15000&_journal_mode=WAL&_foreign_keys=on&synchronous=normal"

    [Scanner]
    Schedule = "@every 1h"
