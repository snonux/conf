# navidrome-data: static hostPath PV on the NFS export (like the other apps),
# so Navidrome can run on any r-node. It used to be a local-path PVC on r1
# (pinned via nodeSelector), which made r1 a single point of failure for the
# music service (audit 2026-09-25 #8).
#
# Holds the SQLite DB (navidrome.db + WAL) and Navidrome's image/transcoding
# cache (default /data/cache). Nothing is node-local: node pinning and
# node-bound volumes are not allowed in this cluster. The cache over NFS
# costs some startup/thumbnail latency (the reason /data once left NFS);
# that is accepted in exchange for running on any node. SQLite-on-NFS lock
# fragility is contained by the Recreate strategy and a single RWO claim:
# only one pod ever opens the DB.
#
# The NFS export is mounted at the same path on r0/r1/r2, so the hostPath
# resolves identically on every node. type: Directory makes the mount fail
# (instead of silently using an empty local dir) if the path is missing.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: navidrome-data-pv
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/nfs/k3svolumes/navidrome/data
    type: Directory
---
# New claim name: a PVC's storageClassName is immutable, so the old
# local-path claim (navidrome-data-pvc) could not be converted in place.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-data-nfs-pvc
  namespace: services
spec:
  storageClassName: ""
  # Bind explicitly so the claim can never grab another Available PV.
  volumeName: navidrome-data-pv
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# navidrome-music: keep on NFS — 200 GB library shared across nodes.
# This is a static PV backed by hostPath at the NFS mount point. The NFS
# export is mounted at the same path on all three r-nodes (r0/r1/r2), so the
# hostPath resolves identically on each node.
#
# ReadWriteMany (not RWO): Navidrome mounts this read-only as the library
# reader; the beets-art CronJob mounts it read-write to fetch and embed cover
# art. RWX lets beets-art run on any r-node (it no longer has to co-locate
# with Navidrome just to satisfy RWO's single-node-mount rule). At the FS
# level there is a single writer (beets-art; Forbid concurrency) and a single
# reader (Navidrome), so no write contention.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: navidrome-music-pv
spec:
  capacity:
    storage: 200Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/nfs/k3svolumes/navidrome/music
    type: Directory
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-music-pvc
  namespace: services
spec:
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
