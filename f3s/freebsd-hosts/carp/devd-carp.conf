# Managed by gonf (freebsd_carp_devd_hook, gonf/freebsd/carp.go); source
# f3s/freebsd-hosts/carp/devd-carp.conf in the conf repo.
#
# CARP state hook of the f0/f1 storage pair (VIP 192.168.1.138, vhid 1):
# on every MASTER/BACKUP transition carpcontrol.sh starts or stops the NFS
# server and stunnel. Until 2026-09-25 this block was appended by hand to
# /etc/devd.conf; it must exist in exactly one place, else it fires twice.

notify 0 {
	match "system"          "CARP";
	match "subsystem"       "[0-9]+@[0-9a-z.]+";
	match "type"            "(MASTER|BACKUP)";
	action "/usr/local/bin/carpcontrol.sh $subsystem $type";
};
