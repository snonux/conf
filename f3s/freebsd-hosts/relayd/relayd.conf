# k3s nodes backend table
table <k3s_nodes> { 10.20.0.120 10.20.0.121 10.20.0.122 }

# TCP forwarding to Traefik (no TLS termination)
relay "lan_http" {
    listen on 10.20.0.138 port 80
    forward to <k3s_nodes> port 80 check tcp
}

relay "lan_https" {
    listen on 10.20.0.138 port 443
    forward to <k3s_nodes> port 443 check tcp
}

# Retained until old clients migrate.
relay "lan_http_compat" {
    listen on 192.168.1.138 port 80
    forward to <k3s_nodes> port 80 check tcp
}

relay "lan_https_compat" {
    listen on 192.168.1.138 port 443
    forward to <k3s_nodes> port 443 check tcp
}
