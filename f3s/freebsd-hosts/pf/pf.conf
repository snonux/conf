# Host firewall on f0-f3; gonf freebsd_firewall_config owns /etc/pf.conf.
# Bridge forwarding is deliberately outside this ruleset: gonf pins
# net.link.bridge.pfil_member=0 and net.link.bridge.pfil_bridge=0.
# Do not skip re0: packets delivered to the host must still be filtered.
lan_if = "re0"
wg_if = "wg0"
storage_vip = "192.168.1.138"
wg_port = "56709"

table <trusted_lan> const { 192.168.1.0/24, 10.20.0.0/24, fd22:c702:acb7::/64, fd02:ca0b:f1cb:20::/64, fe80::/10 }
table <carp_pair> const { 192.168.1.130, 192.168.1.131 }

# S7 will tighten local service access separately.
set skip on lo0

block in log all
# Shared-wire f3 pilot: prevent an experimental new physical primary from
# teaching old-only referring peers an endpoint they cannot route back to.
# This is dormant on other hosts and on f3's accepted old-source transport.
# Keep until the six referring hosts have accepted new return paths; the
# address rollback restores old-source traffic without removing this guard.
block out log quick on $lan_if inet proto udp from 10.20.0.133 to { 192.168.1.120, 192.168.1.121, 192.168.1.122, 192.168.1.130, 192.168.1.131, 192.168.1.132 } port $wg_port
# f1 follows the accepted f3 pilot. Keep old-source transport to referring
# peers that have not migrated; f3 already has a verified new return path.
block out log quick on $lan_if inet proto udp from 10.20.0.131 to { 192.168.1.120, 192.168.1.121, 192.168.1.122, 192.168.1.130, 192.168.1.132 } port $wg_port
pass out quick all keep state

# Trusted management and services, including UPS, Garage 3900/3901/3903,
# and r0-r2 stunnel to the storage VIP on 2323. Global SLAAC source
# addresses are deliberately not part of the trusted LAN prefixes.
pass in quick on $lan_if from <trusted_lan> to ($lan_if) keep state

# Shared-LAN migration: the authenticated laptop wg2 peer reaches SSH through
# triggerfish. The host migration helper installs its explicit return /32.
# Accept this narrow prerequisite before arming an address transaction; keep
# the old LAN rule above and bridge filtering bypass unchanged.
pass in quick on $lan_if inet proto tcp from 10.99.0.2 to ($lan_if) port 22 keep state

# Authenticated mesh: management, monitoring, frontend Garage clients and
# zrepl f0 -> f1 / f3 -> f2 on TCP 8888. Permit tunnel establishment on
# re0 over either IP family; WireGuard authenticates peers itself.
pass in quick on $wg_if all keep state
pass in quick on $lan_if proto udp from any to ($lan_if) port $wg_port keep state

# CARP advertisements must reach both members regardless of VIP ownership.
pass in quick on $lan_if inet proto carp from <carp_pair> to 224.0.0.18 no state

# LAN ingress remains available on both members across a CARP transition.
# No public IPv6 listener is opened by this IPv4 VIP rule.
pass in quick on $lan_if inet proto tcp from 192.168.1.0/24 to $storage_vip port { 80, 443 } keep state

# Diagnostics and path-MTU errors; preserve SLAAC, neighbour discovery and
# duplicate-address detection (whose source may be :: or a global address).
pass in quick on $lan_if inet proto icmp all keep state
pass in quick on $lan_if inet6 proto ipv6-icmp all icmp6-type { unreach, toobig, timex, paramprob, echoreq, echorep, routersol, routeradv, neighbrsol, neighbradv, groupqry, grouprep, groupterm } keep state
