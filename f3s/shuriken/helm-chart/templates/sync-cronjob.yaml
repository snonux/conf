# shuriken-sync: a SEPARATE CronJob that publishes the generated
# /data/shuriken.sh/<site>/dist trees to the public web servers (fishfinger +
# blowfish) over the authenticated rsync DAEMON protocol on WireGuard (no SSH).
# A separately provisioned Kubernetes Secret supplies only the password file;
# frontend rsyncd also restricts source IPs to the r-nodes and frontend peers.
# The writable modules `irregular-ninja` and
# `alt-irregular-ninja` are declared in gonf/frontends/assets/rsyncd.conf.tmpl (deploy
# with `./gonf.sh cluster frontends frontends_rsync`).
#
# Publish every newly generated album, including reshuffles of the same images.
# Compare each site's complete dist/status.json with the last successfully
# published copy (<site>/.last-published-status.json on NFS). Its generated_at
# timestamp changes after every successful generation, even when image_count
# and total_size_bytes stay the same. Repeated sync ticks without a new
# generation remain no-ops. The shuriken `--sync` over SSH stays available;
# this CronJob uses the rsync daemon protocol instead.
#
# The nfs-check initContainer refuses to start if NFS is down on the node, so
# rsync --delete can never run against an empty/stale source and wipe the live
# public site.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: shuriken-sync
  namespace: services
spec:
  # Twice a day, during daytime hours, offset to :30 so a tick never lands
  # on top of an hourly shuriken generation start (minute 0, except the
  # excluded 12:00 beets-art slot). Generation keeps a stable hour (the
  # hour-quantized marker in cronjob.yaml), so wherever that hour settles,
  # a tick skipped because generation holds the flock is caught up by the
  # next one; the per-site status snapshot makes publishing idempotent.
  # Each tick is a cheap per-site status.json comparison; only sites that
  # actually changed since the last publish get rsynced.
  schedule: "30 10,18 * * *"
  timeZone: Europe/Sofia
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          hostAliases:
            # The frontends are reached over the WireGuard mesh (.wg0); cluster
            # DNS does not resolve *.wg0 names, so pin them to the mesh IPs.
            - ip: 192.168.2.111
              hostnames:
                - fishfinger.wg0
                - fishfinger.wg0.wan.buetow.org
            - ip: 192.168.2.110
              hostnames:
                - blowfish.wg0
                - blowfish.wg0.wan.buetow.org
          initContainers:
            - name: nfs-check
              image: busybox:1.36.1
              command:
                - sh
                - -c
                - |
                  test -f /mnt/shuriken.sh/.nfs-sentinel || (
                    echo "ERROR: NFS sentinel missing at /mnt/shuriken.sh/.nfs-sentinel"
                    echo "refusing to publish; NFS likely unmounted on this node"
                    echo "rsync --delete against an empty/stale source would wipe the live site"
                    exit 1
                  )
              volumeMounts:
                - name: data
                  mountPath: /mnt
                  readOnly: true
          containers:
            - name: shuriken-sync
              image: registry.lan.buetow.org:30001/shuriken:0.14.1
              imagePullPolicy: Always
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  D=/data/shuriken.sh
                  PASSWORD_FILE=/etc/shuriken-rsync/password
                  if [ ! -s "$PASSWORD_FILE" ]; then
                    echo "shuriken-sync: rsync password file missing or empty" >&2
                    exit 1
                  fi

                  # Mutually exclude with the generation CronJob: don't publish
                  # while a generation is running. Non-blocking -- if the lock is
                  # held (generation in progress), skip this tick and let the next
                  # one publish once generation finishes. flock auto-releases if
                  # the generation pod dies, so a crash never wedges the sync.
                  exec 9>"$D/.lock"
                  if ! flock -n 9; then
                    echo "shuriken-sync: generation in progress (lock held); skipping"
                    exit 0
                  fi

                  published=0
                  for pair in irregular.ninja:irregular-ninja alt.irregular.ninja:alt-irregular-ninja; do
                    site=${pair%%:*}
                    mod=${pair##*:}
                    status="$D/$site/dist/status.json"
                    backup="$D/$site/.last-published-status.json"

                    if [ ! -f "$status" ]; then
                      echo "shuriken-sync: $status absent (generation in progress or failed); skipping $site"
                      continue
                    fi

                    # Include generated_at: the same source images still
                    # produce a new shuffled album on every generation.
                    if cmp -s "$status" "$backup"; then
                      echo "shuriken-sync: $site unchanged since last publish; skipping"
                      continue
                    fi

                    echo "shuriken-sync: $site changed since last publish; publishing"
                    for srv in fishfinger.wg0 blowfish.wg0; do
                      echo "shuriken-sync: $site -> rsync://$srv/$mod/"
                      rsync -a --delete --info=stats1 --timeout=120 --contimeout=15 \
                          --password-file="$PASSWORD_FILE" \
                          "$D/$site/dist/" "rsync://shuriken@$srv/$mod/"
                    done

                    # Acknowledge only after BOTH mirrors succeed. Atomic
                    # rename keeps an interrupted copy eligible for retry.
                    cp "$status" "$backup.tmp"
                    mv "$backup.tmp" "$backup"
                    published=1
                  done

                  if [ "$published" -eq 0 ]; then
                    echo "shuriken-sync: nothing changed; no sites published"
                  else
                    echo "shuriken-sync: done"
                  fi
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: "1"
                  memory: 512Mi
              securityContext:
                allowPrivilegeEscalation: false
                runAsUser: 0
                runAsGroup: 0
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: tmp
                  mountPath: /tmp
                - name: rsync-auth
                  mountPath: /etc/shuriken-rsync
                  readOnly: true
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: shuriken-data-pvc
            - name: tmp
              emptyDir:
                sizeLimit: 256Mi
            - name: rsync-auth
              secret:
                secretName: shuriken-rsync-auth
                defaultMode: 0400
                items:
                  - key: password
                    path: password
