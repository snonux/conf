replication_factor = 3
consistency_mode = "consistent"

metadata_dir = "/var/db/garage/meta"
data_dir = [
  { path = "/var/db/garage/data", capacity = "23G" }
]
metadata_auto_snapshot_interval = "6h"

db_engine = "lmdb"

rpc_secret = "__RPC_SECRET__"
rpc_bind_addr = "0.0.0.0:3901"
rpc_public_addr = "192.168.1.130:3901"

[s3_api]
api_bind_addr = "0.0.0.0:3900"
s3_region = "garage"
# Enables virtual-hosted-style addressing: a request whose Host is
# <bucket>.f3s.buetow.org is resolved to that bucket. Needed because the AWS
# SDK derives the hostname as <bucket>.<endpoint>, and Taskwarrior's stock
# Fedora package has no sync.aws.force_path_style to fall back on. So the
# taskwarrior-garage bucket is reached as taskwarrior-garage.f3s.buetow.org,
# proxied by relayd on the OpenBSD frontends.
#
# Path-style access is unaffected and keeps working alongside this (verified),
# so existing consumers such as watchos-app are not impacted.
root_domain = ".f3s.buetow.org"

[admin]
api_bind_addr = "0.0.0.0:3903"
