# Managed by gonf: triggerfish_network.
set skip on lo

# Temporary until all workloads have moved over or been renumbered.
# The downstream /24 temporarily shares igc0 with the upstream LAN.
# Always translate to the upstream address, not igc0's 192.168.11.2 alias.
match out on igc0 inet from 192.168.11.0/24 to any nat-to 192.168.1.2

# Retain the installed OpenBSD baseline policy.
block return
pass
# Both ports may receive downstream clients; the alias remains on igc0.
pass in on { igc0 igc1 } inet from 192.168.11.0/24 to any
block return in on ! lo0 proto tcp to port 6000:6010
block return out log proto { tcp udp } user _pbuild
