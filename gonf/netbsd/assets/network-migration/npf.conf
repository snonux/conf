$ext_if = "{{.Interface}}"
# j24: the OLD address (retired in i24) and the igc1 recovery address are
# gone, so their rules are too; only the lab address keeps its services.
$host4 = { {{.LabIPv4}} }
$lab6 = {{.ULA}}

group "external" on $ext_if {
	pass stateful out final all
	# Existing IPv4 SSH/HTTP/DTail service exposure on the lab address.
	pass stateful in final family inet4 proto tcp to $host4 port { 22, 80, 2222 }
	pass stateful in final family inet4 proto icmp all
	# Native ULA stays local; router IPv6 transit remains denied separately.
	pass stateful in final family inet6 proto tcp from fd02:ca0b:f1cb:20::/64 to $lab6 port { 22, 80, 2222 }
	pass stateful in final family inet6 proto ipv6-icmp all
}

group "wireguard" on tun0 {
	pass stateful out final all
	pass stateful in final family inet4 all
	pass stateful in final family inet6 all
}

group default {
	pass final on lo0 all
	block all
}
