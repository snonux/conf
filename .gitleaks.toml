title = "conf secret scanning"
minVersion = "v8.30.1"

[extend]
useDefault = true

# Public AWS documentation examples only; do not exempt whole files or rules.
[[allowlists]]
description = "AWS published example credentials"
regexTarget = "secret"
regexes = [
  '''^AKIAIOSFODNN7EXAMPLE$''',
  '''^wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY$''',
]

[[rules]]
id = "wireguard-private-key"
description = "WireGuard private key assigned in interface configuration"
regex = '''(?mi)^[\t ]*PrivateKey[\t ]*=[\t ]*["']?([A-Za-z0-9+/]{43}=)["']?[\t ]*$'''
secretGroup = 1
keywords = ["PrivateKey"]
