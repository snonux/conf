# logfile_name		owner:group     mode count size when  flags
/var/cron/log		root:wheel	600  3     10   *     Z
/var/log/authlog	root:wheel	640  7     *    168   Z
/var/log/daemon				640  14    300  *     Z
/var/log/lpd-errs			640  7     10   *     Z
/var/log/maillog			640  7     *    24    Z
/var/log/messages			644  5     300  *     Z
/var/log/secure				600  7     *    168   Z
/var/log/wtmp				644  7     *    $M1D4 B ""
/var/log/xferlog			640  7     250  *     Z
/var/log/pflog				600  3     250  *     ZB "pkill -HUP -u root -U root -t - -x pflogd"
# Size cap, not just the weekly slot: relayd health-checks every relay against
# the local httpd (`forward to <localhost> ... check http "/"`), and each probe
# logs a line, so this file grows ~250MB/day of near-pure noise. With size "*"
# it only rotated on Sundays and reached 1GB in four days, filling /var to 105%
# on blowfish. 100MB (value is in KB) bounds it; keep 7 rather than 14 so the
# compressed tail stays modest too.
/var/www/logs/access.log		644  7    102400    $W0   Z "pkill -USR1 -u root -U root -x httpd"
/var/www/logs/error.log			644  7     250  *     Z "pkill -USR1 -u root -U root -x httpd"
/var/log/fooodds			640  7     300  *     Z
